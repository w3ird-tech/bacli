[package]
authors     = ["w3irdrobot <dro@w3ird.tech>"]
description = "A wrapper around the Bitaxe API, enabling the management of a Bitaxe device in an easy to use way."
edition     = "2021"
homepage    = "https://github.com/w3ird-tech/bacli"
license     = "	AGPL-3.0-only"
name        = "bacli"
repository  = "https://github.com/w3ird-tech/bacli"
version     = "0.7.0"

[dependencies]
anyhow = "1.0.104"
bitaxe_api = { version = "0.5.1", path = "../bitaxe_api", default-features = false, features = [
  "clap",
  "rustls",
] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
config = { version = "0.15.27", default-features = false, features = [
  "async",
  "convert-case",
  "yaml",
] }
directories = "6.0.0"
env_logger = "0.11.11"
futures = "0.3.34"
humantime = "2.4.0"
ipnetwork = "0.21.1"
log = "0.4.35"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
